<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Manuale della Reception</title>

  <!-- Font di progetto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Foglio di stile principale -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

  <!-- Sfondo animato su Canvas -->
  <canvas id="bgCanvas"></canvas>

  <main class="admin-container">
    <div class="admin-card">
      
      <!-- Header con Logo e Titolo -->
      <header class="admin-header">
        <img src="assets/logo.png" alt="Grand Hotel Azzurra" class="admin-logo">
        <div class="admin-title-group">
          <h1>Admin</h1>
          <p class="subtitle-mono">Accesso riservato</p>
        </div>
      </header>

      <!-- Box di Login (visibile di default) -->
      <div id="loginBox">
        <form id="loginForm" autocomplete="off">
          <div class="field-group">
            <label for="passwordInput" class="input-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              Chiave di Accesso
            </label>
            <input type="password" id="passwordInput" class="admin-input" placeholder="••••••••" autofocus required autocomplete="current-password">
          </div>

          <div class="status-message" id="loginStatus"></div>

          <button type="submit" class="btn-primary-pill w-full" id="loginBtn">Accedi</button>
        </form>
      </div>

      <!-- Box utente già autenticato (nascosto) -->
      <div id="loggedBox" class="logged-box" style="display:none;">
        <p class="logged-text">Sei attualmente connesso come <strong>Amministratore</strong>.</p>
        <div class="logged-actions">
          <a href="/" class="btn-primary-pill">Vai al manuale</a>
          <button class="btn-link-mono" id="logoutBtn">Esci</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Script di Sfondo e Logica Admin -->
  <script src="bg.js"></script>
  <script>
    const loginBox = document.getElementById('loginBox');
    const loggedBox = document.getElementById('loggedBox');
    const passwordInput = document.getElementById('passwordInput');
    const loginStatus = document.getElementById('loginStatus');
    const loginBtn = document.getElementById('loginBtn');
    const loginForm = document.getElementById('loginForm');

    // Controllo stato autenticazione iniziale
    async function checkStatus() {
      try {
        const res = await fetch('/api/admin/status');
        const data = await res.json();
        loginBox.style.display = data.isAdmin ? 'none' : 'block';
        loggedBox.style.display = data.isAdmin ? 'block' : 'none';
      } catch (e) {
        console.error('Errore nel controllo dello stato:', e);
      }
    }

    // Invio Form di Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      loginStatus.textContent = 'Verifica in corso…';
      loginStatus.className = 'status-message info';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });

        const data = await res.json();

        if (!res.ok) {
          loginStatus.textContent = data.error || 'Password non valida.';
          loginStatus.className = 'status-message err';
          passwordInput.value = '';
          passwordInput.focus();
          return;
        }

        loginStatus.textContent = '';
        passwordInput.value = '';
        checkStatus();
      } catch (e) {
        loginStatus.textContent = 'Errore di connessione al server.';
        loginStatus.className = 'status-message err';
      } finally {
        loginBtn.disabled = false;
      }
    });

    // Gestione Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      checkStatus();
    });

    checkStatus();
  </script>
</body>
</html>
